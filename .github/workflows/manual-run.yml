# Manuelle Testläufe mit echten Konten – weiterhin OHNE Veröffentlichung.
# Bewusst KEIN schedule: GitHub Actions ist hier nur für Entwicklung/Test gedacht.
name: VICE OVERDRIVE manueller Lauf
on:
  workflow_dispatch:
    inputs:
      step:
        description: "Was testen?"
        type: choice
        options: [radar, radar-clips, publish-dry-run, tiktok-check, tiktok-revoke-old, youtube-check, autopilot-privat-test]
        default: radar
permissions:
  contents: read
jobs:
  autopilot:
    # Ein Autopilot-Durchgang mit PRIVATEM YouTube-Upload (höchstens 1 Video).
    if: inputs.step == 'autopilot-privat-test'
    uses: ./.github/workflows/autopilot.yml
    with:
      youtube: private
      tiktok_inbox: false
    secrets: inherit
  run:
    if: inputs.step != 'autopilot-privat-test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Radar Twitch + YouTube (nur lesen, nichts hochladen)
        if: inputs.step == 'radar'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 -m vo radar && cat data/radar/*.md
      - uses: actions/setup-node@v4
        if: inputs.step == 'radar-clips'
        with:
          node-version: '22'
      - name: Werkzeuge für den Radar-Schnitt installieren (nur im Runner)
        if: inputs.step == 'radar-clips'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m venv "${RUNNER_TEMP}/vice-overdrive-venv"
          "${RUNNER_TEMP}/vice-overdrive-venv/bin/python" -m pip install 'yt-dlp[default]==2026.10.26'
      - name: Radar → Download → Schnitt (kein Plattform-Upload)
        if: inputs.step == 'radar-clips'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          export PATH="${RUNNER_TEMP}/vice-overdrive-venv/bin:$PATH"
          python3 -m vo radar-clips
      - name: TikTok prüfen bzw. alten Zugang widerrufen (kein Upload, nichts posten)
        if: inputs.step == 'tiktok-check' || inputs.step == 'tiktok-revoke-old'
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python3 -m vo ${{ inputs.step }}
      - name: YouTube-Zugang und Zielkanal prüfen (kein Upload)
        if: inputs.step == 'youtube-check'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 -m vo youtube-check
      - name: Publish Dry-Run (YouTube + TikTok)
        if: inputs.step == 'publish-dry-run'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m vo selftest --out selftest-out
          python3 -m vo --data selftest-out publish youtube
          python3 -m vo --data selftest-out publish tiktok
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manueller-lauf
          retention-days: 3
          path: |
            data/radar/
            selftest-out/logs/
          if-no-files-found: ignore
      - name: Geschnittene Radar-Clips zur Prüfung als Repo-Artefakt
        if: inputs.step == 'radar-clips' && success()
        uses: actions/upload-artifact@v4
        with:
          name: radar-clips-nicht-gepostet
          retention-days: 3
          path: |
            data/shorts/
            data/approvals/
            data/logs/
          if-no-files-found: ignore
