# TikTok-Autopilot (nur Video-Entwürfe, keine Veröffentlichung). Nur noch manuell:
# Sandbox-Entwürfe kamen bei Enis weder in der iPhone-App noch in TikTok Studio an (2026-11-18).
# Den Stundenlauf übernimmt jetzt export.yml (fertige Clips + Caption zum Selbsthochladen).
name: VICE OVERDRIVE Autopilot
on:
  workflow_dispatch:
    inputs:
      tiktok_inbox:
        description: "Video als TikTok-Entwurf senden (nie veröffentlichen)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      tiktok_inbox:
        type: boolean
        default: true
concurrency:
  group: vice-overdrive-autopilot
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Zustand laden (verhindert doppelte Uploads)
        uses: actions/cache/restore@v4
        with:
          # Muss exakt dieselbe Pfadliste wie beim Speichern sein, sonst findet GitHub den Cache nicht.
          path: |
            data/autopilot
            !data/autopilot/**/*.mp4
            !data/autopilot/**/*.mkv
            !data/autopilot/**/*.webm
            !data/autopilot/**/*.part
            !data/autopilot/**/*.lock
            !data/autopilot/state/tiktok-token.json
          key: autopilot-state-${{ github.run_id }}
          restore-keys: autopilot-state-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Werkzeuge installieren (nur im Runner)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m venv "${RUNNER_TEMP}/vice-overdrive-venv"
          "${RUNNER_TEMP}/vice-overdrive-venv/bin/python" -m pip install -q 'yt-dlp[default]==2026.10.26'
      - name: Autopilot (ein Durchgang)
        env:
          VO_ACTIONS_UPLOAD: "1"
          TIKTOK_INBOX: ${{ github.event_name == 'schedule' && (vars.VO_TIKTOK_INBOX || 'true') || (inputs.tiktok_inbox && 'true' || 'false') }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
        run: |
          export PATH="${RUNNER_TEMP}/vice-overdrive-venv/bin:$PATH"
          # Manuell gestartete Läufe sind gewollt und warten nicht auf die 30-Minuten-Pause.
          MIN_GAP=30
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then MIN_GAP=0; fi
          extra=""
          if [ "$TIKTOK_INBOX" = "true" ]; then extra="--tiktok-inbox"; fi
          python3 -m vo autopilot --text-source files --youtube off $extra \
            --max-uploads 1 --min-gap-minutes "$MIN_GAP"
      - name: Zustand sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/autopilot
            !data/autopilot/**/*.mp4
            !data/autopilot/**/*.mkv
            !data/autopilot/**/*.webm
            !data/autopilot/**/*.part
            !data/autopilot/**/*.lock
            !data/autopilot/state/tiktok-token.json
          key: autopilot-state-${{ github.run_id }}
      - name: Fertigen Short und Caption ablegen (3 Tage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-short
          retention-days: 3
          path: |
            data/autopilot/shorts/**/short.mp4
            data/autopilot/shorts/**/caption.txt
            data/autopilot/state/last-run.json
          if-no-files-found: ignore
