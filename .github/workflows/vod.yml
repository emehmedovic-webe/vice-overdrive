# VOD-Momente: lauteste Stellen aus den neuesten GTA-VODs der Allowlist-Streamer als Rohmaterial
# (Ausschnitt + Wortliste) für den Feinschnitt im Format v3. Nichts wird gepostet.
# Abholen: https://github.com/emehmedovic-webe/vice-overdrive/releases (vod-momente-*)
name: VICE OVERDRIVE VOD-Momente
on:
  workflow_dispatch:
    inputs:
      per_vod:
        description: "Momente pro VOD"
        type: number
        default: 4
      vods:
        description: "VODs pro Streamer (neueste zuerst)"
        type: number
        default: 1
      logins:
        description: "Twitch-Logins, Komma-getrennt (leer = alle Freigegebenen)"
        type: string
        default: ""
concurrency:
  group: vice-overdrive-autopilot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Zustand laden
        uses: actions/cache/restore@v4
        with:
          path: |
            data/autopilot
            !data/autopilot/**/*.mp4
            !data/autopilot/**/*.mkv
            !data/autopilot/**/*.webm
            !data/autopilot/**/*.part
            !data/autopilot/**/*.lock
            !data/autopilot/state/tiktok-token.json
          key: autopilot-state-${{ github.run_id }}
          restore-keys: autopilot-state-
      - name: Whisper-Modell aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Werkzeuge aus dem Cache
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/vo-tools
          key: vo-tools-v1-${{ env.ImageOS }}-${{ env.ImageVersion }}-ffmpeg_zip-ytdlp2026.10.26-fw1.2.1
      - name: Werkzeuge installieren (beim ersten Mal ~10 min, danach aus dem Cache ~1 min)
        env:
          NEEDRESTART_MODE: l
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ "${{ steps.tools.outputs.cache-hit }}" = "true" ]; then
            sudo dpkg -i ~/vo-tools/debs/*.deb >/dev/null
          else
            mkdir -p ~/vo-tools/debs/partial
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends -o APT::Keep-Downloaded-Packages=true -o Dir::Cache::archives="$HOME/vo-tools/debs" ffmpeg zip
            sudo chown -R "$USER" ~/vo-tools/debs
            python3 -m venv ~/vo-tools/venv
            ~/vo-tools/venv/bin/python -m pip install -q 'yt-dlp[default]==2026.10.26' 'faster-whisper==1.2.1'
          fi
          ln -sfn ~/vo-tools/venv "${RUNNER_TEMP}/vice-overdrive-venv"
      - name: Momente holen
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          PER_VOD: ${{ inputs.per_vod || 4 }}
          VODS: ${{ inputs.vods || 1 }}
          LOGINS: ${{ inputs.logins || '' }}
        run: |
          export PATH="${RUNNER_TEMP}/vice-overdrive-venv/bin:$PATH"
          "${RUNNER_TEMP}/vice-overdrive-venv/bin/python" -m vo vod-mine --out vod-momente --per-vod "${PER_VOD}" --vods "${VODS}" --logins "${LOGINS}"
          rm -rf data/autopilot/vod-work
      - name: Zustand sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/autopilot
            !data/autopilot/**/*.mp4
            !data/autopilot/**/*.mkv
            !data/autopilot/**/*.webm
            !data/autopilot/**/*.part
            !data/autopilot/**/*.lock
            !data/autopilot/state/tiktok-token.json
          key: autopilot-state-${{ github.run_id }}
      - name: Release mit ZIP anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls vod-momente/*/_roh/source.mp4 >/dev/null 2>&1; then echo "Keine Momente."; exit 0; fi
          stamp=$(date -u +%Y-%m-%d_%H%M)
          (cd vod-momente && zip -q -r "../VOD-Momente_${stamp}.zip" .)
          gh release create "vod-momente-${stamp}" "VOD-Momente_${stamp}.zip" \
            --title "VOD-Momente ${stamp} UTC" --notes-file vod-momente/MOMENTE.md --latest=false
